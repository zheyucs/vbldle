<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="vbldle is a daily and infinite volleyball guessing game where players identify styles from clues."
    />
    <meta
      name="keywords"
      content="vbldle, volleyball legends game, roblox, volleyball guessing game, daily volleyball game, guessing, game, style guessing"
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#ff681f" />
    <meta property="og:title" content="vbldle | VBL Guessing Game" />
    <meta
      property="og:description"
      content="Daily and infinite volleyball legends-style guessing game ."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vbldle.web.app/" />
    <meta property="og:image" content="https://vbldle.web.app/dailyicon.png" />
    <meta property="og:site_name" content="vbldle" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="vbldle | Volleyball Legends Guessing Game"
    />
    <meta
      name="twitter:description"
      content="Play the daily and infinite volleyball legends style guessing game online."
    />
    <meta name="twitter:image" content="https://vbldle.web.app/dailyicon.png" />
    <link rel="canonical" href="https://vbldle.web.app/" />
    <title>vbldle | Daily Volleyball Guessing Game</title>
    <link
      id="site-favicon"
      rel="icon"
      type="image/png"
      href="./dailyicon.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "vbldle",
        "applicationCategory": "Game",
        "operatingSystem": "Web",
        "description": "vbldle is a daily and infinite volleyball legends style guessing game where players guess styles from clues.",
        "url": "https://vbldle.web.app/",
        "image": "https://vbldle.web.app/dailyicon.png",
        "genre": "Sports Game",
        "audience": {
          "@type": "Audience",
          "audienceType": "Volleyball legends players"
        }
      }
    </script>
    <meta
      name="google-site-verification"
      content="ln-oGer8jCPl3eY_KD0rcKPPaEr17kj8_4751uY8dvo"
    />
  </head>
  <body>
    <nav class="mode-switch" aria-label="Game mode">
      <button id="daily-mode" class="mode-button" type="button">Daily</button>
      <button id="infinite-mode" class="mode-button" type="button">
        Infinite
      </button>
    </nav>
    <main class="game-box">
      <p id="mode-kicker" class="mode-kicker">DAILY MODE</p>
      <h1>
        <img
          id="site-icon"
          class="site-icon"
          src="./dailyicon.png"
          alt="vbldle logo"
        /><span>vbldle</span>
      </h1>
      <p id="mode-description" class="subtitle">Resetted daily.</p>
      <p id="mode-date" class="mode-date"></p>
      <p class="seo-intro">
        Play vbldle, the daily and infinite volleyball legends style guessing
        game.
      </p>

      <form id="guess-form" class="guess-form" autocomplete="off">
        <input
          id="guess-input"
          type="text"
          placeholder="Search style..."
          aria-label="Search style"
          spellcheck="false"
        />
        <button type="submit">Guess</button>
      </form>
      <div class="suggestions" id="suggestions"></div>

      <div class="game-meta">
        <span id="game-status">Choose a style to begin.</span>
        <span id="guess-count">0 / 6</span>
      </div>

      <button id="reset-game" class="reset-button" type="button" hidden>
        Reset game
      </button>

      <div class="table-wrap">
        <table id="guess-board">
          <thead>
            <tr>
              <th class="guess-number-header">#</th>
              <th>Style Name</th>
              <th>Rarity</th>
              <th>Status</th>
              <th>Released</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
    <dialog id="round-report" class="round-report">
      <button
        id="close-report"
        class="close-report"
        type="button"
        aria-label="Close result"
      >
        &times;
      </button>
      <p class="report-kicker">ROUND COMPLETE</p>
      <h2 id="report-title">Result</h2>
      <img id="report-icon" class="report-icon" alt="Round result" />
      <p id="report-copy"></p>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
